appId: com.azgaar.fantasy-map-generator
copyright: Copyright © 2017-2026 Azgaar and contributors
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**/*
  - package.json
  - "!node_modules/**/*" # the renderer is bundled by Vite, the main process only needs Electron itself
asar: true
# store, not compress: the bundle is already minified, and skipping decompression
# makes both the install and every cold start noticeably faster
compression: store
afterPack: ./scripts/adhoc-sign.mjs
artifactName: fmg-${version}-${os}-${arch}.${ext}
# double-clicking a saved map opens it in the app (see electron/main.ts file intake)
fileAssociations:
  - ext: map
    name: Fantasy Map Generator Map
    description: Fantasy Map Generator save file
    role: Editor
mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  icon: build/icon.ico # generated from build/icon.png by scripts/electron.mjs when missing
  requestedExecutionLevel: asInvoker # per-user install needs no admin rights and no UAC prompt
  target:
    - target: nsis
      arch: [x64, arm64]
linux:
  category: Graphics
  maintainer: Azgaar <azgaar.fmg@yandex.com>
  synopsis: Generate and edit fantasy maps
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # otherwise a third installer carrying both architectures is built next to the per-arch ones
  buildUniversalInstaller: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Fantasy Map Generator
  uninstallDisplayName: Fantasy Map Generator
  packElevateHelper: false
publish:
  provider: github
  releaseType: draft
